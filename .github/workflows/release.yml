name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run Rule Verification
        run: |
          if [ -f ".agents/skills/code-review/scripts/check-rules.sh" ]; then
            bash .agents/skills/code-review/scripts/check-rules.sh
          fi

      - name: Configure Linux Kernel for Unprivileged Sandboxing (Ubuntu 24.04+)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe overlay || true

      - name: Run Test Battery
        run: go test -race -count=1 ./...

      - name: Cross-Compile Linux Binaries
        env:
          VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X 'safebox/internal/cli.Version=${VERSION}' -X 'safebox/internal/cli.GitCommit=${GIT_COMMIT:0:7}' -X 'safebox/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          
          echo "Compiling linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="$LDFLAGS" \
            -o dist/safebox-linux-amd64 .

          echo "Compiling linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags="$LDFLAGS" \
            -o dist/safebox-linux-arm64 .

      - name: Package Release Tarballs & Checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          tar -czf "safebox-${VERSION}-linux-amd64.tar.gz" safebox-linux-amd64
          tar -czf "safebox-${VERSION}-linux-arm64.tar.gz" safebox-linux-arm64
          cp "safebox-${VERSION}-linux-amd64.tar.gz" "safebox-linux-amd64.tar.gz"
          cp "safebox-${VERSION}-linux-arm64.tar.gz" "safebox-linux-arm64.tar.gz"
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Safebox ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/safebox-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/safebox-${{ github.ref_name }}-linux-arm64.tar.gz
            dist/safebox-linux-amd64.tar.gz
            dist/safebox-linux-arm64.tar.gz
            dist/checksums.txt
